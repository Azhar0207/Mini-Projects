<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weight Converter</title>
  </head>
  <body>
    <div class="container">
      <h2>Weight Converter</h2>
      <div class="convertSection">
        <select name="" id="selectOne" class="select">
          <option value="kg">kg</option>
          <option value="Pounds">Pounds</option>
          <option value="Gram">Gram</option>
        </select>
        <input
          type="text"
          id="inputOne"
          class="input"
          placeholder="Enter Number"
        />
        
        <button id="convertBtn">Converte</button>
        
        <select name="" id="selectTwo" class="select">
          <option value="Pounds">Pounds</option>
          <option value="Gram">Gram</option>
          <option value="kg">kg</option>
        </select>
        <input type="text" id="inputTwo" class="input" readonly />
      </div>
      <h3 id="resultDisplay">
        Your weight converted from <span id="weightConevrtedFrom"></span> to
        <span id="weightConevrtedTo"></span>
      </h3>
    </div>

    <script src="script.js"></script>
  </body>
</html>
